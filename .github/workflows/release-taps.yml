name: Update authorized release taps

# Called with the validated release tuple after explicit release publication,
# or manually dispatched from protected main to recover an existing release.
#
# This job does NOT rebuild binaries. It downloads checksums.txt from the
# published GitHub release and generates the Homebrew cask and Scoop manifest
# directly from those checksums, then pushes them using a short-lived GitHub
# App token scoped only to lewta/homebrew-tap and lewta/scoop-bucket.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to push formula/manifest for (e.g. v0.10.0)"
        required: true
      sha:
        description: 'Full commit SHA of the existing release tag'
        required: true

permissions:
  contents: read

jobs:
  authorize:
    uses: ./.github/workflows/release-authorize.yml
    with:
      tag: ${{ inputs.tag }}
      sha: ${{ inputs.sha }}
      recovery: true

  update-taps:
    needs: authorize
    environment: release-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.control_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate published release and exact artifact checksums
        id: checksums
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ needs.authorize.outputs.control_sha }}
          RELEASE_TAG: ${{ needs.authorize.outputs.tag }}
          RELEASE_SHA: ${{ needs.authorize.outputs.sha }}
          CHECKSUM_FILE: ${{ runner.temp }}/checksums.txt
        run: |
          set -euo pipefail
          git fetch --force --prune origin '+refs/heads/main:refs/remotes/origin/main'
          bash .github/scripts/validate-release-input.sh recovery
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern checksums.txt --output "$CHECKSUM_FILE"
          bash .github/scripts/validate-release-input.sh checksums

      # Mint a token scoped to only the two repos that need to be updated.
      # GitHub App installation tokens are capped at 1 h by the API, but
      # skip-token-revoke defaults to false so the token is revoked automatically
      # when this job finishes — in practice it lives for ~30–60 s.
      # Requires a GitHub App with Contents: Read and write on homebrew-tap
      # and scoop-bucket, installed on the lewta account.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: homebrew-tap,scoop-bucket

      - name: Push Homebrew cask
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.authorize.outputs.tag }}
          DARWIN_AMD64: ${{ steps.checksums.outputs.darwin_amd64 }}
          DARWIN_ARM64: ${{ steps.checksums.outputs.darwin_arm64 }}
          LINUX_AMD64: ${{ steps.checksums.outputs.linux_amd64 }}
          LINUX_ARM64: ${{ steps.checksums.outputs.linux_arm64 }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"

          cat > /tmp/sendit.rb << CASK
          # This file was generated by the release pipeline. DO NOT EDIT.
          cask "sendit" do
            name "sendit"
            desc "Traffic generation tool for HTTP, DNS, WebSocket, and headless-browser targets."
            homepage "https://github.com/lewta/sendit"
            version "${VERSION}"

            livecheck do
              skip "Auto-generated on release."
            end

            binary "sendit"
            bash_completion "completions/sendit.bash"
            zsh_completion "completions/sendit.zsh"
            fish_completion "completions/sendit.fish"

            on_macos do
              on_intel do
                url "https://github.com/lewta/sendit/releases/download/v#{version}/sendit_#{version}_darwin_amd64.tar.gz"
                sha256 "${DARWIN_AMD64}"
              end
              on_arm do
                url "https://github.com/lewta/sendit/releases/download/v#{version}/sendit_#{version}_darwin_arm64.tar.gz"
                sha256 "${DARWIN_ARM64}"
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/lewta/sendit/releases/download/v#{version}/sendit_#{version}_linux_amd64.tar.gz"
                sha256 "${LINUX_AMD64}"
              end
              on_arm do
                url "https://github.com/lewta/sendit/releases/download/v#{version}/sendit_#{version}_linux_arm64.tar.gz"
                sha256 "${LINUX_ARM64}"
              end
            end

            # No zap stanza required
          end
          CASK

          # Dedent: strip the leading spaces added by YAML block indentation
          sed -i 's/^          //' /tmp/sendit.rb

          FILE_SHA=$(gh api repos/lewta/homebrew-tap/contents/Casks/sendit.rb \
            --jq .sha 2>/dev/null || true)

          if [[ -n "$FILE_SHA" ]]; then
            gh api repos/lewta/homebrew-tap/contents/Casks/sendit.rb \
              --method PUT \
              -f "message=Brew cask update for sendit version ${TAG}" \
              -f "content=$(base64 -w0 /tmp/sendit.rb)" \
              -f "sha=${FILE_SHA}"
          else
            gh api repos/lewta/homebrew-tap/contents/Casks/sendit.rb \
              --method PUT \
              -f "message=Brew cask update for sendit version ${TAG}" \
              -f "content=$(base64 -w0 /tmp/sendit.rb)"
          fi

      - name: Push Scoop manifest
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.authorize.outputs.tag }}
          WIN_AMD64: ${{ steps.checksums.outputs.windows_amd64 }}
          WIN_ARM64: ${{ steps.checksums.outputs.windows_arm64 }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"

          cat > /tmp/sendit.json << JSON
          {
              "version": "${VERSION}",
              "architecture": {
                  "64bit": {
                      "url": "https://github.com/lewta/sendit/releases/download/${TAG}/sendit_${VERSION}_windows_amd64.zip",
                      "bin": [
                          "sendit.exe"
                      ],
                      "hash": "${WIN_AMD64}"
                  },
                  "arm64": {
                      "url": "https://github.com/lewta/sendit/releases/download/${TAG}/sendit_${VERSION}_windows_arm64.zip",
                      "bin": [
                          "sendit.exe"
                      ],
                      "hash": "${WIN_ARM64}"
                  }
              },
              "homepage": "https://github.com/lewta/sendit",
              "license": "MIT",
              "description": "Traffic generation tool for HTTP, DNS, WebSocket, and headless-browser targets."
          }
          JSON

          # Dedent: strip the leading spaces added by YAML block indentation
          sed -i 's/^          //' /tmp/sendit.json

          FILE_SHA=$(gh api repos/lewta/scoop-bucket/contents/sendit.json \
            --jq .sha 2>/dev/null || true)

          if [[ -n "$FILE_SHA" ]]; then
            gh api repos/lewta/scoop-bucket/contents/sendit.json \
              --method PUT \
              -f "message=Scoop update for sendit version ${TAG}" \
              -f "content=$(base64 -w0 /tmp/sendit.json)" \
              -f "sha=${FILE_SHA}"
          else
            gh api repos/lewta/scoop-bucket/contents/sendit.json \
              --method PUT \
              -f "message=Scoop update for sendit version ${TAG}" \
              -f "content=$(base64 -w0 /tmp/sendit.json)"
          fi

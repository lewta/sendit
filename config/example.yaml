pacing:
  mode: human                   # human | rate_limited | scheduled | burst
  requests_per_minute: 20
  jitter_factor: 0.4
  min_delay_ms: 800
  max_delay_ms: 8000
  # All schedule entries are validated even when mode is not scheduled.
  schedule:
    - cron: "0 9 * * 1-5"       # scheduler standard syntax; weekdays at 09:00
      duration_minutes: 30       # must be positive
      requests_per_minute: 40    # must be positive
  # ramp_up_s is only used when mode: burst
  # ramp_up_s: 30               # linearly ramp up over 30 s; 0 = immediate full speed

limits:
  max_workers: 4
  max_browser_workers: 1
  cpu_threshold_pct: 60.0
  memory_threshold_mb: 512       # must be positive

rate_limits:
  default_rps: 0.5
  per_domain:
    - domain: "example.com"      # must not be blank
      rps: 0.2                   # must be positive
    - domain: "httpbin.org"      # must not be blank
      rps: 1.0                   # must be positive

backoff:
  initial_ms: 1000
  max_ms: 120000
  multiplier: 2.0
  max_attempts: 3

# Optional: load targets from a plain-text file (url + type per line).
# Targets from targets_file are appended to any inline targets defined below.
# targets_file: "config/targets.txt"

# Default values applied to every target loaded from targets_file.
# Override any field per-target by specifying it in the file (weight only)
# or use inline targets for full control.
target_defaults:
  weight: 1
  # auth: applies shared credentials to all targets loaded from targets_file.
  # Inline targets can override or omit auth entirely.
  # auth:
  #   type: bearer                 # bearer | basic | header | query
  #   token_env: API_TOKEN         # env var holding the token (preferred over literal)
  #   # token: "literal-secret"   # literal value — triggers a startup warning
  http:
    http_version: 0            # 0 auto | 1 HTTP/1.1 | 2 HTTPS-only HTTP/2 (no fallback)
    method: GET
    headers:
      User-Agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36"
    timeout_s: 15
    # allow_cross_host_redirects: false  # opt in only when redirects to other hosts are expected
  browser:
    scroll: false
    timeout_s: 30
  dns:
    resolver: "8.8.8.8:53"
    record_type: A
  websocket:
    duration_s: 30
    expect_messages: 0
  grpc:
    timeout_s: 15
    # tls: false       # force TLS even when scheme is grpc://
    # insecure: false  # skip TLS certificate verification
  sftp:
    port: 22
    operation: upload
    timeout_s: 30
    insecure: false

targets:
  # Non-standard ports are specified directly in the URL:
  # - url: "http://internal-service.example.com:8080/health"
  #   weight: 1
  #   type: http
  # - url: "wss://stream.example.com:9443/feed"
  #   weight: 1
  #   type: websocket
  # For DNS, non-standard resolver ports use host:port in dns.resolver:
  # - url: "example.com"
  #   type: dns
  #   dns:
  #     resolver: "192.168.1.1:5353"
  # gRPC target — server must have reflection enabled; no .proto files needed:
  # - url: "grpc://api.example.com:50051/helloworld.Greeter/SayHello"
  #   weight: 4
  #   type: grpc
  #   grpc:
  #     body: '{"name": "world"}'
  #     timeout_s: 15
  # SFTP target — supports upload, download, and list operations:
  # - url: "sftp://sftp.example.com/uploads/test.bin"
  #   weight: 2
  #   type: sftp
  #   sftp:
  #     username: testuser
  #     password: secret
  #     insecure: false
  #     operation: upload
  #     file_size_min_bytes: 1024
  #     file_size_max_bytes: 1048576
  #     allowed_host_key_types: [ssh-ed25519]
  # Auth examples — token values resolved from env vars at dispatch time:
  # - url: "https://api.example.com/data"
  #   weight: 1
  #   type: http
  #   auth:
  #     type: bearer
  #     token_env: API_TOKEN
  # - url: "https://api.example.com/search"
  #   weight: 1
  #   type: http
  #   auth:
  #     type: basic
  #     username: alice
  #     password_env: API_PASS
  # - url: "https://api.example.com/v2/data"
  #   weight: 1
  #   type: http
  #   auth:
  #     type: header
  #     header_name: X-API-Key
  #     token_env: API_KEY
  # - url: "https://api.example.com/v3/data"
  #   weight: 1
  #   type: http
  #   auth:
  #     type: query
  #     param_name: api_key
  #     token_env: API_KEY
  # Request templates expand once per request. Relative vars_file paths use
  # this YAML file's directory; replacement values are not expanded again.
  - url: "https://httpbin.org/anything/users/{{user_id}}/{{seq}}?request={{uuid}}&at={{timestamp}}"
    weight: 2
    type: http
    vars:
      user_id: [alice, bob]
    vars_file:
      region: "regions.txt" # one value per line; blank lines ignored
    http:
      method: POST
      http_version: 0          # use 2 only with HTTPS targets that support h2 ALPN
      body: '{"user":"{{user_id}}","region":"{{region}}","sequence":{{seq}}}'

  - url: "https://httpbin.org/get"
    weight: 10
    type: http
    http:
      method: GET
      headers:
        User-Agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36"
        Accept: "text/html,application/xhtml+xml"
      timeout_s: 15

  - url: "https://httpbin.org/status/200"
    weight: 5
    type: http
    http:
      method: GET
      headers:
        User-Agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36"
      timeout_s: 10

  - url: "https://news.ycombinator.com"
    weight: 3
    type: browser
    browser:
      scroll: true
      wait_for_selector: "#hnmain"
      timeout_s: 30

  - url: "example.com"
    weight: 3
    type: dns
    dns:
      resolver: "8.8.8.8:53"
      record_type: A

# Optional: write request results to a file for offline analysis.
# JSONL includes replay metadata; keep append: false for a single replayable run.
# Auth, custom HTTP headers, URL userinfo and SFTP make a target non-replayable.
# Use a header-free/unauthenticated capture config for sendit replay --input <file>.
# output:
#   enabled: true
#   file: "sendit-results.jsonl"  # path to output file
#   format: jsonl                  # jsonl | csv
#   append: false                  # true = append to existing file
#   pcap_file: "capture.pcap"     # write a synthetic PCAP alongside the output file

metrics:
  enabled: false
  bind_address: "127.0.0.1"
  prometheus_port: 9090          # when enabled, must be 1..65535

daemon:
  pid_file: "/tmp/sendit.pid"
  log_level: info
  log_format: text

name: Recover AUR

# Publishes an existing GitHub release to AUR without attempting to recreate
# or modify the immutable GitHub release. Use this after a release succeeds on
# GitHub but AUR publication fails independently.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish to AUR (e.g. v1.6.1)"
        required: true

permissions: read-all

jobs:
  publish-aur:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Load recovery configuration from main
        run: |
          git fetch --no-tags origin main --depth=1
          git show FETCH_HEAD:.goreleaser.yaml > "${RUNNER_TEMP}/goreleaser.yaml"

      - name: Publish existing release to AUR
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de  # v7
        with:
          version: "~> v2"
          args: release --config ${{ runner.temp }}/goreleaser.yaml --clean --skip=homebrew,scoop,notarize
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: ${{ inputs.tag }}
          SKIP_GH_RELEASE: "true"
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}

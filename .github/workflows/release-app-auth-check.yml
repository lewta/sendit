name: Verify release App authentication

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: 'Full protected-main commit SHA expected from this dispatch'
        required: true
        type: string

permissions: {}

concurrency:
  group: release-app-auth-check
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Authorize protected-main diagnostic
        env:
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REF: ${{ github.ref }}
          REF_PROTECTED: ${{ github.ref_protected }}
          DISPATCH_SHA: ${{ github.sha }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          test "$REPOSITORY" = lewta/sendit
          test "$EVENT_NAME" = workflow_dispatch
          test "$DISPATCH_REF" = refs/heads/main
          test "$REF_PROTECTED" = true
          [[ "$EXPECTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_MAIN_SHA" = "$DISPATCH_SHA"

  verify-release-app:
    needs: authorize
    environment: release-production
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Mint repository-scoped diagnostic token
        id: release-app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: lewta
          repositories: sendit
          # Match the production release token. The diagnostic makes no write request.
          permission-contents: write
          permission-workflows: write
          skip-token-revoke: false
      - name: Verify authentication, repository scope, and main identity
        env:
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
          GH_PROMPT_DISABLED: '1'
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          umask 077
          tmp="$(mktemp -d)"
          cleanup() {
            rm -rf -- "$tmp"
          }
          trap cleanup EXIT

          gh api --method GET '/installation/repositories?per_page=100' > "$tmp/repositories.json"
          jq -e '
            .total_count == 1 and
            (.repositories | type == "array" and length == 1) and
            .repositories[0].full_name == "lewta/sendit"
          ' "$tmp/repositories.json" > /dev/null

          gh api --method GET '/repos/lewta/sendit/git/ref/heads/main' > "$tmp/main.json"
          jq -e --arg sha "$EXPECTED_MAIN_SHA" '
            .ref == "refs/heads/main" and
            .object.type == "commit" and
            .object.sha == $sha
          ' "$tmp/main.json" > /dev/null

          echo '::notice::Release App authentication and repository scope verified; no write operation was attempted.'

services:
  sendit:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - ./config.yaml:/etc/sendit/config.yaml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

# Optional dashboards require explicitly adding docker-compose.observability.yml.
# See README for the authenticated profile and local anonymous Viewer demo.

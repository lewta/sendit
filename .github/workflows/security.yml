name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'  # Weekly on Monday

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pinned govulncheck
        env:
          GOTOOLCHAIN: local
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Prepare metadata output
        run: mkdir .vulnerability-raw

      # OSV exits nonzero for module-coordinate findings. A later mandatory
      # evaluator requires complete JSON; this cannot make an error clean.
      - name: Collect pinned OSV metadata
        id: osv
        uses: google/osv-scanner-action/osv-scanner-action@0a65f82af05cd58cf587827b0bb0489548c18346  # v2.7.0
        continue-on-error: true
        with:
          scan-args: |-
            scan
            source
            --lockfile=go.mod
            --config=osv-scanner.toml
            --no-call-analysis=go
            --all-packages
            --format=json
            --output-file=.vulnerability-raw/osv.json

      - name: Evaluate source contexts and metadata
        if: always()
        env:
          GOTOOLCHAIN: local
          OSV_OUTCOME: ${{ steps.osv.outcome }}
        run: bash .github/scripts/run-vulnerability-scans.sh "$PWD" "$RUNNER_TEMP/vulnerability-evidence" "$PWD/.vulnerability-raw/osv.json" "$OSV_OUTCOME"

      # Upload only the allowlisted artifact directory. Raw streams and stderr
      # stay in temporary files and are removed by the scanner wrapper.
      - name: Retain sanitized advisory evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: vulnerability-evidence
          path: ${{ runner.temp }}/vulnerability-evidence/
          retention-days: 14
          if-no-files-found: error

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4
        with:
          languages: go

      - uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4

      # Starting April 2026, CodeQL skips file coverage on PRs for performance.
      # File coverage is still computed on push-to-main analyses.
      # Accepted as default — Codecov covers per-file coverage on PRs.
      # To opt out: set CODEQL_ACTION_FILE_COVERAGE_ON_PRS=true in env.
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4
